name: Build lane
description: >
  Checks out lanewayhq/laneway at a ref, sets up Go, and builds the lane
  binary. The repository is public, so the workflow's own token is enough,
  including on pull requests from forks; a deploy key or token is only
  needed if it ever goes private again.
inputs:
  ssh-key:
    description: A read-only deploy key of lanewayhq/laneway (the LANEWAY_DEPLOY_KEY secret). Optional; used when set.
    required: false
    default: ''
  token:
    description: A token that can read lanewayhq/laneway (the LANEWAY_REPO_TOKEN secret). Optional; used when no deploy key is set, else the workflow's own token.
    required: false
    default: ''
  ref:
    description: The lanewayhq/laneway branch, tag or commit to build.
    required: true
outputs:
  lane:
    description: The lane binary.
    value: ${{ steps.build.outputs.lane }}
  src:
    description: Laneway's source.
    value: ${{ github.workspace }}/.laneway
runs:
  using: composite
  steps:
    - name: Check out lanewayhq/laneway at ${{ inputs.ref }}
      uses: actions/checkout@v4
      with:
        repository: lanewayhq/laneway
        ref: ${{ inputs.ref }}
        ssh-key: ${{ inputs.ssh-key }}
        token: ${{ inputs.token || github.token }}
        path: .laneway
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          .laneway/go.sum
    - name: Build lane
      id: build
      shell: bash
      run: |
        cd .laneway
        go build -o "$RUNNER_TEMP/lane" ./cmd/lane
        echo "lane=$RUNNER_TEMP/lane" >> "$GITHUB_OUTPUT"
        echo "Built lane from lanewayhq/laneway $(git rev-parse HEAD) (${{ inputs.ref }})" >> "$GITHUB_STEP_SUMMARY"

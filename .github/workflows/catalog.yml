name: Catalog

# CI never holds the Catalog's private key. It checks that the committed
# Catalog is signed with the public key in keys/catalog.pub (as Laneway
# checks it) and is exactly what the Plugin releases build to, and, on
# main, publishes it as the latest release, where Laneway fetches it:
# releases/latest/download/catalog.json and catalog.json.sig.
on:
  pull_request:
    paths: ['catalog/**', 'keys/**', 'internal/catalog/**', 'cmd/plugins/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['catalog/**', 'keys/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the Catalog's signature and that it is what the releases build to
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-catalog.sh

  publish:
    needs: verify
    concurrency: catalog-publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the Catalog as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f catalog/catalog.json ]; then
            echo "There is no Catalog yet; nothing to publish."
            exit 0
          fi
          tag="catalog/$(date -u +%Y%m%d%H%M%S)"
          gh release create "$tag" catalog/catalog.json catalog/catalog.json.sig --target "$GITHUB_SHA" --latest \
            --title "Catalog $(date -u +%Y-%m-%d)" \
            --notes "The signed Catalog of first-party Plugins, as of $GITHUB_SHA. Laneway fetches it from releases/latest/download/catalog.json."

name: Catalog

# Signs the Catalog and publishes it as the latest release, where Laneway
# fetches it: releases/latest/download/catalog.json (+ .sig).
#
# The Release workflow calls this after each Plugin release, so pushing a
# tag <plugin>/v<version> ends here. It can also be run by hand on main, to
# publish again after a run was rejected or after replacing the key.
#
# The private key is a secret of the `catalog-signing` Environment, which
# only main and <plugin>/v<version> tags may use, and which waits for the
# maintainer's approval on every run: that approval is the one step between
# a tag and every Laneway machine, so no run signs without it. Once
# approved, the job rebuilds the Catalog from every Plugin release on
# GitHub, so it lists every release published by then, whichever run is
# approved; a run that finds the published Catalog already up to date
# publishes nothing, unless it is run by hand with `force`.
on:
  workflow_call:
    inputs:
      reason:
        description: What this Catalog adds, such as "mysql 1.0.1", for its release notes
        type: string
        required: false
  workflow_dispatch:
    inputs:
      reason:
        description: Why the Catalog is published again, for its release notes
        required: false
      force:
        description: Publish even if the published Catalog lists the same releases, such as after replacing the key
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    # Holds the signing key. Its protection rules make this job wait for a
    # required reviewer's approval, and only on main or a release tag.
    environment: catalog-signing
    # One at a time, so each publish starts from the one before it.
    concurrency: catalog-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The key is in this job, so it runs only this repository's code and
      # GitHub's own actions, pinned to exact commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a commit that isn't on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main; only reviewed code signs the Catalog."
            exit 1
          fi
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # Everything that downloads runs before the key is written.
      - name: Build the Catalog from every Plugin release
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          go build -o "$RUNNER_TEMP/plugins" ./cmd/plugins
          export PLUGINS="$RUNNER_TEMP/plugins"
          scripts/build-catalog.sh
          published="$RUNNER_TEMP/published"
          if [ "$FORCE" != true ] && gh release download --repo "$GITHUB_REPOSITORY" --pattern catalog.json --dir "$published" 2>/dev/null &&
            cmp -s "$published/catalog.json" catalog/catalog.json; then
            echo "The published Catalog already lists every release; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign the Catalog and publish it as the latest release
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "$CATALOG_SIGNING_KEY" ]; then
            echo "The catalog-signing Environment has no CATALOG_SIGNING_KEY secret; see keys/README.md." >&2
            exit 1
          fi
          PLUGINS="$RUNNER_TEMP/plugins"
          key="$RUNNER_TEMP/catalog.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$CATALOG_SIGNING_KEY" > "$key")
          "$PLUGINS" sign -key "$key" catalog/catalog.json
          rm -f "$key"
          "$PLUGINS" verify -pub keys/catalog.pub catalog/catalog.json
          tag="catalog/$(date -u +%Y%m%d%H%M%S)"
          {
            if [ -n "$REASON" ]; then
              printf 'Adds %s.\n\n' "$REASON"
            fi
            printf 'The signed Catalog of first-party Plugins, built from every Plugin release, signed from %s (%s). Laneway fetches it from releases/latest/download/catalog.json.\n\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"
            printf 'It lists:\n\n'
            jq -r '.plugins[] | "- \(.name): \([.releases[].version] | join(", "))"' catalog/catalog.json
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" catalog/catalog.json catalog/catalog.json.sig --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "Catalog $(date -u +%Y-%m-%d)" --notes-file "$RUNNER_TEMP/notes.md"

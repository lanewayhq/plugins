# Why this case's golden.json is the rustfs case's: a golden file shows only
# the Recipe's layer, and the Recipe wires the s3 disk to the private Bucket
# whatever Buckets the Project declares. The public Bucket below, and the
# Project's own [env] keys using {rustfs_bucket_public}, are the Project's
# layer, which Laneway puts over the Recipe's. This case pins that declaring
# them changes nothing in the Recipe's answer (and warns about nothing); the
# wiring itself, AWS_PUBLIC_BUCKET in each Worktree's .env, is covered by
# Laneway's e2e test
# TestALaravelAppDeclaringRustFSHasItsS3DiskPointedAtEachWorktreesBucket.

[services]
rustfs = "1"

# Production serves avatars from a second, public bucket: the app's
# public_s3 disk reads AWS_PUBLIC_BUCKET and AWS_PUBLIC_URL.
[buckets.public]
public = true

[env]
AWS_PUBLIC_BUCKET = "{rustfs_bucket_public}"
AWS_PUBLIC_URL = "{rustfs_endpoint}/{rustfs_bucket_public}"

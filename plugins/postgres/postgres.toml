# Postgres. Its superuser is the shared user, with the shared password; the
# image creates it on the first start.
#
# The data directory is set explicitly (PGDATA) because the images moved it
# in Postgres 18 (to /var/lib/postgresql/<major>/docker, with the volume at
# /var/lib/postgresql): with PGDATA and the volume at the old place, every
# version keeps its data in Laneway's volume the same way.
name = "postgres"
default_version = "18"
image = "docker.io/library/postgres"
port = 5432
data_dir = "/var/lib/postgresql/data"
user = "laneway"

[env]
POSTGRES_USER = "{user}"
POSTGRES_PASSWORD = "{password}"
PGDATA = "/var/lib/postgresql/data"

# pg_isready over TCP exits 0 once the server accepts connections, and not
# while it answers "the database system is starting up". The image's first
# start runs a temporary server on a Unix socket only, so TCP fails until
# the real one listens.
[[ready]]
kind = "command"
command = ["pg_isready", "--quiet", "--host=127.0.0.1", "--port=5432", "--username={user}", "--dbname=postgres"]

# Every command is psql logged in over the container's Unix socket, which
# the image trusts, in the maintenance database: one statement, printed one
# row per line with no headers. VERBOSITY verbose puts the SQLSTATE in an
# error ("ERROR:  55006: …"), which clone looks for.
[database]
max_name = 63 # NAMEDATALEN - 1
exists = ["psql", "-X", "-q", "-t", "-A", "-v", "ON_ERROR_STOP=1", "-v", "VERBOSITY=verbose", "-U", "{user}", "-d", "postgres",
  "-c", "SELECT 1 FROM pg_database WHERE datname = '{db}'"]
# CREATE DATABASE is all or nothing.
create = ["psql", "-X", "-q", "-t", "-A", "-v", "ON_ERROR_STOP=1", "-v", "VERBOSITY=verbose", "-U", "{user}", "-d", "postgres",
  "-c", 'CREATE DATABASE "{db}"']
# WITH (FORCE) (Postgres 13 and later) closes every connection to it first.
drop = ["psql", "-X", "-q", "-t", "-A", "-v", "ON_ERROR_STOP=1", "-v", "VERBOSITY=verbose", "-U", "{user}", "-d", "postgres",
  "-c", 'DROP DATABASE IF EXISTS "{db}" WITH (FORCE)']
list = ["psql", "-X", "-q", "-t", "-A", "-v", "ON_ERROR_STOP=1", "-v", "VERBOSITY=verbose", "-U", "{user}", "-d", "postgres",
  "-c", "SELECT datname FROM pg_database WHERE NOT datistemplate"]
# CREATE DATABASE … TEMPLATE copies the database's files. Postgres refuses
# while anyone else is connected to the template (SQLSTATE 55006), and the
# main Worktree's app, its queue worker or a GUI client often is. So then the
# script closes those connections (pg_terminate_backend) and tries again, up
# to 5 times: CREATE DATABASE waits a few seconds for the closed
# connections' backends to exit. psql's own session is in the maintenance
# database, never the template. Laravel reconnects on its next query; a
# queue worker exits on the lost connection and its Process is restarted
# like any crash.
clone = ["sh", "-c", '''
user=$1 from=$2 to=$3
sql() { psql -X -q -t -A -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -U "$user" -d postgres -c "$1"; }
attempt=1
while ! err=$(sql "CREATE DATABASE \"$to\" TEMPLATE \"$from\"" 2>&1 >/dev/null); do
  case $err in
  *" 55006: "*) ;;
  *) printf '%s\n' "$err" >&2; exit 1 ;;
  esac
  if [ "$attempt" -eq 5 ]; then
    printf '%s is still in use after closing its connections %d times: %s\n' "$from" $((attempt - 1)) "$err" >&2
    exit 1
  fi
  sql "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$from' AND pid <> pg_backend_pid()" >/dev/null || exit 1
  attempt=$((attempt + 1))
done
''', "sh", "{user}", "{from}", "{to}"]

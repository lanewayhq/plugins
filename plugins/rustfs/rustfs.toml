# RustFS: S3-compatible object storage. The S3 API is on port 9000, served at
# the s3 Service Domain, and the console on web_port 9001, at the rustfs one
# (its UI is under /rustfs/console/; "/" answers 403). Each Worktree gets its
# own Bucket in it (see [bucket]).
#
# The root credentials are the shared user and password: RustFS 1.0 sets no
# minimum length for them (only for IAM users it creates), and the console
# logs in with them too. Data is in the named volume at /data: the image owns
# /data as UID 10001, and the container engine copies that into a new volume,
# so it needs no chown. Nothing but Buckets may be put in /data, since each of
# its top-level directories is one.
name = "rustfs"
default_version = "1"
port = 9000
web_port = 9001
data_dir = "/data"
user = "laneway"

# RustFS tags only full releases (1.0.4), so version "1" is mapped to one,
# pinned by digest: the multi-platform index of docker.io/rustfs/rustfs:1.0.4.
# A patch release reaches Projects with a release of this Plugin mapping "1"
# to it.
[versions."1"]
image = "docker.io/rustfs/rustfs@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2"

[env]
RUSTFS_ACCESS_KEY = "{user}"
RUSTFS_SECRET_KEY = "{password}"
# Logs go to stdout, where the container engine keeps them, rather than to
# /logs in the container (the image's default).
RUSTFS_OBS_LOG_DIRECTORY = ""

# 503, as every S3 request is, until storage and IAM are up; then 200. It
# needs no login.
[[ready]]
kind = "http"
path = "/health/ready"

# The S3 API, at https://s3.<Dashboard Domain>. First, so it is
# {rustfs_endpoint}: an app's endpoint, public URLs and presigned URLs all
# use it. The proxy keeps the Host header, which a request's signature
# covers.
[[domains]]
label = "s3"
port = 9000

# The console, at https://rustfs.<Dashboard Domain>/rustfs/console/. It calls
# its API on its own origin, so it needs nothing from the s3 Domain.
[[domains]]
label = "rustfs"
port = 9001

# Each command is a script run in the container: one request signed with the
# image's curl (--aws-sigv4) against the server on 9000, with the credentials
# from the container's environment, so none is in a command's arguments.
# Only clone and size need RustFS's rc, which the image doesn't bundle yet:
# they first fetch rc 0.1.37 for the container's architecture, check it
# against the SHA-256 pinned here, and keep it in $HOME (the container's
# writable layer, never /data), so it is fetched once per container. Bucket
# names are passed as arguments, never written into a script.
[bucket]
# Prints {bucket} if it exists and isn't an unfinished copy, nothing if it
# doesn't; fails on any other answer.
exists = ["sh", "-c", '''
set -eu
b=$1
sig() { curl -sS --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" "$@"; }
code=$(sig -o /dev/null -w '%{{http_code}}' -I "http://127.0.0.1:9000/$b")
case $code in
200) ;;
404) exit 0 ;;
*) echo "HEAD /$b answered HTTP $code" >&2; exit 1 ;;
esac
tags=$(sig -w '%{{http_code}}' "http://127.0.0.1:9000/$b?tagging")
case $tags in
*'<Key>laneway-clone</Key>'*) exit 0 ;;
*200 | *404) echo "$b" ;;
*) echo "GET /$b?tagging: $tags" >&2; exit 1 ;;
esac
''', "sh", "{bucket}"]
# Creates {bucket}, empty and private. exists said no, so a Bucket already
# there is a copy that never finished: it is dropped first.
create = ["sh", "-c", '''
set -eu
b=$1
s3() { curl -sS --fail-with-body -o /dev/stderr --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" "$@"; }
s3 -X DELETE -H 'x-rustfs-force-delete: true' "http://127.0.0.1:9000/$b" 2>/dev/null || :
s3 -X PUT "http://127.0.0.1:9000/$b"
''', "sh", "{bucket}"]
# x-rustfs-force-delete removes the Bucket with its objects, policy, CORS and
# tags in one request on the server (rc deletes object by object). 404, a
# Bucket already gone, is fine.
drop = ["sh", "-c", '''
set -eu
b=$1
out=$(curl -sS -w '%{{http_code}}' -X DELETE -H 'x-rustfs-force-delete: true' --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" "http://127.0.0.1:9000/$b")
case $out in
204 | *404) ;;
*) echo "DELETE /$b: $out" >&2; exit 1 ;;
esac
''', "sh", "{bucket}"]
# ListBuckets' names, one per line, unfinished copies included.
list = ["sh", "-c", '''
set -eu
xml=$(curl -sS --fail-with-body --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" http://127.0.0.1:9000/) || { echo "$xml" >&2; exit 1; }
printf '%s' "$xml" | grep -o '<Name>[^<]*</Name>' | sed 's/<[^>]*>//g' || :
''']
# Copies every object of {from} into a new Bucket {to} with rc's cp, which
# copies on the server (CopyObject) and keeps each object's metadata, unlike
# rc mirror. {to} is tagged laneway-clone until the copy is complete (so
# exists doesn't see it if the container stops mid-copy), and dropped if the
# copy fails.
clone = ["sh", "-c", '''
set -eu
case $(uname -m) in
x86_64) arch=amd64 sum=31e79fe7697c870e60f5b5c9008adbb3ad5af7f9f2ab45a3d68585c5f87238d1 ;;
aarch64) arch=arm64 sum=a02091205fe4d9fbf0d16a0dac3d46ad7fac7d5266024b5b17e76327a4e88aa8 ;;
*) echo "rc: no release for $(uname -m)" >&2; exit 1 ;;
esac
rc=$HOME/.cache/laneway/rc-$sum
if [ ! -x "$rc" ]; then
  mkdir -p "${rc%/*}"
  tmp=$(mktemp -d "${rc%/*}/fetch.XXXXXX")
  trap 'rm -rf "$tmp"' EXIT
  url=https://github.com/rustfs/cli/releases/download/v0.1.37/rustfs-cli-linux-$arch-v0.1.37.tar.gz
  echo "downloading rc 0.1.37 for $arch from $url" >&2
  curl -fsSL --retry 3 -o "$tmp/rc.tar.gz" "$url"
  got=$(sha256sum "$tmp/rc.tar.gz" | cut -d ' ' -f 1)
  if [ "$got" != "$sum" ]; then
    echo "rc: $url has SHA-256 $got, not $sum" >&2
    exit 1
  fi
  tar -xzf "$tmp/rc.tar.gz" -C "$tmp" rc
  chmod 0755 "$tmp/rc"
  mv -f "$tmp/rc" "$rc"
  for old in "${rc%/*}"/rc-*; do [ "$old" = "$rc" ] || rm -f "$old"; done
fi
export RC_HOST_local="http://$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY@127.0.0.1:9000"
from=$1 to=$2
s3() { curl -sS --fail-with-body -o /dev/stderr --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" "$@"; }
drop() { s3 -X DELETE -H 'x-rustfs-force-delete: true' "http://127.0.0.1:9000/$1"; }
drop "$to" 2>/dev/null || :
s3 -X PUT "http://127.0.0.1:9000/$to"
s3 -X PUT --data-binary '<Tagging><TagSet><Tag><Key>laneway-clone</Key><Value>incomplete</Value></Tag></TagSet></Tagging>' "http://127.0.0.1:9000/$to?tagging"
if ! "$rc" --quiet --no-progress cp --recursive --concurrency 16 "local/$from/" "local/$to/"; then
  drop "$to" || :
  exit 1
fi
s3 -X DELETE "http://127.0.0.1:9000/$to?tagging"
''', "sh", "{from}", "{to}"]
# Prints the total bytes of {bucket}'s objects, from a full listing by rc.
size = ["sh", "-c", '''
set -eu
case $(uname -m) in
x86_64) arch=amd64 sum=31e79fe7697c870e60f5b5c9008adbb3ad5af7f9f2ab45a3d68585c5f87238d1 ;;
aarch64) arch=arm64 sum=a02091205fe4d9fbf0d16a0dac3d46ad7fac7d5266024b5b17e76327a4e88aa8 ;;
*) echo "rc: no release for $(uname -m)" >&2; exit 1 ;;
esac
rc=$HOME/.cache/laneway/rc-$sum
if [ ! -x "$rc" ]; then
  mkdir -p "${rc%/*}"
  tmp=$(mktemp -d "${rc%/*}/fetch.XXXXXX")
  trap 'rm -rf "$tmp"' EXIT
  url=https://github.com/rustfs/cli/releases/download/v0.1.37/rustfs-cli-linux-$arch-v0.1.37.tar.gz
  echo "downloading rc 0.1.37 for $arch from $url" >&2
  curl -fsSL --retry 3 -o "$tmp/rc.tar.gz" "$url"
  got=$(sha256sum "$tmp/rc.tar.gz" | cut -d ' ' -f 1)
  if [ "$got" != "$sum" ]; then
    echo "rc: $url has SHA-256 $got, not $sum" >&2
    exit 1
  fi
  tar -xzf "$tmp/rc.tar.gz" -C "$tmp" rc
  chmod 0755 "$tmp/rc"
  mv -f "$tmp/rc" "$rc"
  for old in "${rc%/*}"/rc-*; do [ "$old" = "$rc" ] || rm -f "$old"; done
fi
export RC_HOST_local="http://$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY@127.0.0.1:9000"
b=$1
out=$("$rc" --json --no-progress bucket list --recursive --summarize "local/$b/") || exit 1
printf '%s\n' "$out" | sed -n 's/^ *"total_size_bytes": \([0-9]*\),\{0,1\}$/\1/p'
''', "sh", "{bucket}"]
# Lets anyone read {bucket}'s objects if {public} is true (an anonymous
# s3:GetObject bucket policy) and no one if it is false, and replaces its
# CORS configuration with one allowing exactly {origins} (none if empty).
configure = ["sh", "-c", '''
set -eu
b=$1 public=$2 origins=$3
s3() { curl -sS --fail-with-body -o /dev/stderr --aws-sigv4 aws:amz:us-east-1:s3 --user "$RUSTFS_ACCESS_KEY:$RUSTFS_SECRET_KEY" "$@"; }
case $public in
true)
  printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$b" |
    s3 -X PUT --data-binary @- "http://127.0.0.1:9000/$b?policy" ;;
false) s3 -X DELETE "http://127.0.0.1:9000/$b?policy" ;;
*) echo "public must be true or false, not $public" >&2; exit 2 ;;
esac
allowed=
for o in $origins; do allowed="$allowed<AllowedOrigin>$o</AllowedOrigin>"; done
if [ -z "$allowed" ]; then
  s3 -X DELETE "http://127.0.0.1:9000/$b?cors"
  exit 0
fi
printf '<CORSConfiguration><CORSRule>%s<AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>POST</AllowedMethod><AllowedMethod>DELETE</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' "$allowed" |
  s3 -X PUT -H 'Content-Type: application/xml' --data-binary @- "http://127.0.0.1:9000/$b?cors"
''', "sh", "{bucket}", "{public}", "{origins}"]
